<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cursor FM — Music for the agents</title>
    <meta
      name="description"
      content="Cursor FM music for the agents."
    />
    <link rel="canonical" href="https://cursorfm.devjdeed.workers.dev/" />
    <meta name="theme-color" content="#0c0a09" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cursorfm.devjdeed.workers.dev/" />
    <meta property="og:title" content="Cursor FM — Music for the agents" />
    <meta
      property="og:description"
      content="Cursor FM music for the agents."
    />
    <meta property="og:image" content="https://cursorfm.devjdeed.workers.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="860" />
    <meta property="og:image:height" content="538" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cursor FM — Music for the agents" />
    <meta
      name="twitter:description"
      content="Cursor FM music for the agents."
    />
    <meta name="twitter:image" content="https://cursorfm.devjdeed.workers.dev/og.png" />
    <meta name="twitter:image:alt" content="Cursor FM" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RadioStation",
        "name": "Cursor FM",
        "url": "https://cursorfm.devjdeed.workers.dev/",
        "description": "Cursor FM music for the agents.",
        "image": "https://cursorfm.devjdeed.workers.dev/og.png"
      }
    </script>
    <style>
      .stage-loader{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none}
      .stage-loader-track{width:100%;height:2px;overflow:hidden;background:rgba(232,184,109,.18)}
      .stage-loader-fill{width:100%;height:100%;background:#e8b86d;box-shadow:0 0 12px #e8b86d;transform:scaleX(.06);transform-origin:left center;animation:loader-creep 12s cubic-bezier(.12,.7,.2,1) forwards}
      .stage-loader.is-held .stage-loader-fill{animation:none;transition:transform .28s ease-out}
      @keyframes loader-creep{to{transform:scaleX(.86)}}
    </style>
  </head>
  <body>
    <div id="stage" class="stage" aria-hidden="true">
      <div class="stage-loader">
        <div class="stage-loader-track">
          <div class="stage-loader-fill"></div>
        </div>
      </div>
    </div>

    <main id="shell" class="shell">
      <header class="top">
        <p class="live"><span class="live-dot"></span>Live</p>
        <p id="status" class="status">Press play to join the station</p>
      </header>

      <section class="hero">
        <h1>Cursor FM</h1>
        <p class="tagline">Cursor FM music for the agents.</p>
      </section>

      <button id="gate" class="gate" type="button">
        <span class="gate-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path fill="currentColor" d="M8 5.14v13.72L19 12 8 5.14Z" />
          </svg>
        </span>
        Play
      </button>

      <section class="deck" aria-label="Player">
        <button id="mute" class="mute" type="button" aria-label="Mute" aria-pressed="false">
          <svg class="icon-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 9v6h4l5 4V5L8 9H4Zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 17.5 12Z"
            />
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 9v6h4l5 4V5L8 9H4Zm12.5 1.5 1.8-1.8 1.4 1.4-1.8 1.8 1.8 1.8-1.4 1.4-1.8-1.8-1.8 1.8-1.4-1.4 1.8-1.8-1.8-1.8 1.4-1.4 1.8 1.8Z"
            />
          </svg>
        </button>
      </section>
    </main>

    <audio id="mix" playsinline webkit-playsinline></audio>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
